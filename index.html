<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrestaJara</title>
  
  <!-- CONEXIÓN PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/LXYZqPMF/Logo-circular-Presta-Jara.png">

  <style>
    /* VARIABLES GLOBALES IGUALES AL TEMPLATE */
    :root {
      --primary: #3b82f6; 
      --topbar-bg: #ffffff; 
      --border-color: #e2e8f0; 
      --chip-border: #cbd5e1; 
      --bg-color: #f1f5f9; 
      --text-main: #1e293b;
    }
    
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Poppins', sans-serif;
    }
    
    iframe {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1;
    }

    /* ESTILOS DEL SPLASH SCREEN (GLASSMORPHISM) */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg-color); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.hidden {
      opacity: 0; visibility: hidden;
    }

    .module-glass-loader-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; }
    .module-glass-card { position: relative; display: flex; flex-direction: column; align-items: center; padding: 38px 46px; border-radius: 26px; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6) inset; max-width: 380px; width: 100%; text-align: center; overflow: hidden; }
    .module-glass-core { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .module-orbit-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--primary); border-right-color: var(--primary); animation: spin 1.15s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite; opacity: 0.9; }
    .module-orbit-ring-outer { position: absolute; inset: -8px; border-radius: 50%; border: 2px dashed var(--chip-border); border-bottom-color: var(--primary); animation: spinReverse 3.2s linear infinite; opacity: 0.55; }
    .module-logo-circle { width: 72px; height: 72px; border-radius: 50%; background: var(--topbar-bg); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); border: 1px solid var(--border-color); animation: logoBreath 2s ease-in-out infinite; overflow: hidden; padding: 10px; z-index: 2; }
    .module-logo-circle img { width: 100%; height: 100%; object-fit: contain; }
    .module-glass-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; letter-spacing: 0.2px; line-height: 1.3; }
    .module-glass-subtitle { font-size: 0.8rem; font-weight: 500; color: #64748b; display: inline-flex; align-items: center; gap: 3px; margin-bottom: 18px; }
    .module-shimmer-track { width: 100%; max-width: 180px; height: 4px; background: var(--chip-bg); border-radius: 10px; overflow: hidden; position: relative; border: 1px solid var(--border-color); }
    .module-shimmer-bar { position: absolute; top: 0; left: -50%; width: 55%; height: 100%; background: var(--primary); border-radius: 10px; animation: shimmerSlide 1.3s ease-in-out infinite; }
    .dot-pulse span { animation: dotBlink 1.4s infinite both; display: inline-block; font-weight: 700; }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spinReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes logoBreath { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.04); } }
    @keyframes shimmerSlide { 0% { left: -55%; } 100% { left: 105%; } }
    @keyframes dotBlink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="module-glass-loader-wrapper">
      <div class="module-glass-card">
        <div class="module-glass-core">
          <div class="module-orbit-ring-outer"></div>
          <div class="module-orbit-ring"></div>
          <div class="module-logo-circle">
            <img src="https://i.postimg.cc/LXYZqPMF/Logo-circular-Presta-Jara.png" alt="Logo">
          </div>
        </div>
        <div class="module-glass-title">Iniciando PrestaJara...</div>
        <div class="module-glass-subtitle">
          <span>Estableciendo conexión segura</span>
          <span class="dot-pulse"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div class="module-shimmer-track">
          <div class="module-shimmer-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <iframe id="app-frame" allowfullscreen="true"></iframe>

  <script>
    // 1. CARGA DEL IFRAME
    var scriptUrl = "https://script.google.com/macros/s/AKfycbw5Edc5_LGa_7bhhE9SgUZWSSv4eRQYNEHWpCTN-kdzdCn5qWJDeXfuxHfQ3spVFz4F/exec";
    var params = window.location.search;
    var appFrame = document.getElementById('app-frame');
    appFrame.src = scriptUrl + params;

    // 2. REGISTRO DEL SERVICE WORKER (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado', reg))
          .catch(err => console.log('Error SW', err));
      });
    }

    // 3. CAPTURA DEL EVENTO DE INSTALACIÓN
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevenir el banner automático
      e.preventDefault();
      deferredPrompt = e;
      // Le avisamos al iframe que la instalación está disponible
      appFrame.contentWindow.postMessage({ type: 'PWA_AVAILABLE' }, '*');
    });

    // 4. ESCUCHAR MENSAJES DESDE APPS SCRIPT
    window.addEventListener('message', function(event) {
      // A) Ocultar el Splash Screen
      if (event.data === 'HIDE_SPLASH_SCREEN') {
        document.getElementById('splash-screen').classList.add('hidden');
      }
      
      // B) Mostrar de nuevo el Splash Screen (ej: recargas internas)
      if (event.data === 'SHOW_SPLASH_SCREEN') {
        document.getElementById('splash-screen').classList.remove('hidden');
      }

      // C) Disparar el prompt de instalación de PWA
      if (event.data === 'TRIGGER_INSTALL' && deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
             // Avisar al iframe que se instaló para ocultar el botón
             appFrame.contentWindow.postMessage({ type: 'PWA_INSTALLED' }, '*');
          }
          deferredPrompt = null;
        });
      }
    });

    // Fallback: Si Apps Script no responde en 12 segundos, quitamos el loader por si acaso.
    setTimeout(() => {
        document.getElementById('splash-screen').classList.add('hidden');
    }, 12000);
  </script>
</body>
</html>
