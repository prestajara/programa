<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrestaJara</title>
  
  <!-- CONEXIÓN PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a" id="metaThemeColor">
  <!-- LOGO LOCAL -->
  <link rel="apple-touch-icon" href="/programa/logo.png">

  <style>
    /* VARIABLES GLOBALES BASE (Tema Claro por Defecto) */
    :root {
      --primary: #3b82f6; 
      --topbar-bg: #ffffff; 
      --border-color: #e2e8f0; 
      --chip-border: #cbd5e1; 
      --bg-color: #f1f5f9; 
      --text-main: #1e293b;
    }

    /* MODO OSCURO GLOBAL (Se activa añadiendo la clase 'dark-mode' al html o body) */
    html.dark-mode, body.dark-mode {
      --bg-color: #121212 !important; 
      --text-main: #f8fafc !important;
      --topbar-bg: #1e293b !important;
      --border-color: #334155 !important;
    }
    
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Poppins', sans-serif; transition: background-color 0.3s ease;
    }
    
    iframe {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1;
    }

    /* ESTILOS DEL SPLASH SCREEN (GLASSMORPHISM) */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg-color); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.hidden {
      opacity: 0; visibility: hidden;
    }

    .module-glass-loader-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; }
    
    /* Tarjeta Glassmorphism adaptativa */
    .module-glass-card { position: relative; display: flex; flex-direction: column; align-items: center; padding: 38px 46px; border-radius: 26px; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6) inset; max-width: 380px; width: 100%; text-align: center; overflow: hidden; transition: background 0.3s ease, border-color 0.3s ease; }
    
    html.dark-mode .module-glass-card, body.dark-mode .module-glass-card {
      background: rgba(30, 41, 59, 0.85); /* Fondo azul oscuro transparente */
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    .module-glass-core { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .module-orbit-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--primary); border-right-color: var(--primary); animation: spin 1.15s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite; opacity: 0.9; }
    .module-orbit-ring-outer { position: absolute; inset: -8px; border-radius: 50%; border: 2px dashed var(--chip-border); border-bottom-color: var(--primary); animation: spinReverse 3.2s linear infinite; opacity: 0.55; }
    
    .module-logo-circle { width: 72px; height: 72px; border-radius: 50%; background: var(--topbar-bg); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); border: 1px solid var(--border-color); animation: logoBreath 2s ease-in-out infinite; overflow: hidden; padding: 10px; z-index: 2; transition: background 0.3s ease; }
    .module-logo-circle img { width: 100%; height: 100%; object-fit: contain; }
    
    .module-glass-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; letter-spacing: 0.2px; line-height: 1.3; transition: opacity 0.3s ease, color 0.3s ease; }
    .module-glass-subtitle { font-size: 0.8rem; font-weight: 500; color: #64748b; display: inline-flex; align-items: center; gap: 3px; margin-bottom: 18px; transition: opacity 0.3s ease; }
    html.dark-mode .module-glass-subtitle, body.dark-mode .module-glass-subtitle { color: #94a3b8; }
    
    .module-shimmer-track { width: 100%; max-width: 180px; height: 4px; background: rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden; position: relative; border: 1px solid var(--border-color); }
    html.dark-mode .module-shimmer-track, body.dark-mode .module-shimmer-track { background: rgba(255,255,255,0.05); }
    .module-shimmer-bar { position: absolute; top: 0; left: -50%; width: 55%; height: 100%; background: var(--primary); border-radius: 10px; animation: shimmerSlide 1.3s ease-in-out infinite; }
    .dot-pulse span { animation: dotBlink 1.4s infinite both; display: inline-block; font-weight: 700; }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spinReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes logoBreath { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.04); } }
    @keyframes shimmerSlide { 0% { left: -55%; } 100% { left: 105%; } }
    @keyframes dotBlink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    /* Estilos para el botón de rescate (Splash Screen) */
    .splash-rescue-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; background: rgba(0,0,0,0.5); color: white;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      font-size: 0.85rem; cursor: pointer; transition: all 0.3s;
      display: none; opacity: 0; align-items: center; gap: 8px; font-family: 'Poppins', sans-serif;
    }
    html.dark-mode .splash-rescue-btn, body.dark-mode .splash-rescue-btn { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
    .splash-rescue-btn.show { display: flex; animation: fadeInRescue 0.5s forwards; }
    .splash-rescue-btn:hover { background: rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.5); }
    @keyframes fadeInRescue { from { opacity: 0; bottom: 20px; } to { opacity: 1; bottom: 30px; } }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="module-glass-loader-wrapper">
      <div class="module-glass-card">
        <div class="module-glass-core">
          <div class="module-orbit-ring-outer"></div>
          <div class="module-orbit-ring"></div>
          <div class="module-logo-circle">
            <!-- LOGO LOCAL -->
            <img src="/programa/logo.png" alt="Logo">
          </div>
        </div>
        
        <!-- Textos dinámicos -->
        <div class="module-glass-title" id="splashTitle">Iniciando PrestaJara...</div>
        <div class="module-glass-subtitle">
          <span id="splashSubtitle">Estableciendo conexión segura</span>
          <span class="dot-pulse"><span>.</span><span>.</span><span>.</span></span>
        </div>
        
        <div class="module-shimmer-track">
          <div class="module-shimmer-bar"></div>
        </div>
      </div>
    </div>
    
    <!-- Botón de rescate -->
    <button id="splashRescueBtn" class="splash-rescue-btn" onclick="window.location.reload()">
      <svg style="width:16px;height:16px" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2M18 11H13L14.81 9.19A3.94 3.94 0 0 0 12 8A4 4 0 1 0 15.86 13H17.91A6 6 0 1 1 12 6A5.91 5.91 0 0 1 16.22 7.78L18 6Z" /></svg>
      La carga demora. Clic para recargar.
    </button>
  </div>

  <iframe id="app-frame" allowfullscreen="true"></iframe>

  <script>
    // 0. VERIFICAR TEMA GUARDADO EN LOCALSTORAGE (Antes de cargar nada)
    const savedTheme = localStorage.getItem('userTema');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('metaThemeColor').setAttribute("content", "#121212");
    }

    // 1. CARGA DEL IFRAME
    var scriptUrl = "https://script.google.com/macros/s/AKfycbwf_VdoQYldjBd8BCd4QseXT_PnPnMkSo_f_fF_uBjWwloVO3AZ39p5aLZ4g1umXZNx/exec";
    var params = window.location.search;
    var appFrame = document.getElementById('app-frame');
    appFrame.src = scriptUrl + params;

    // 2. REGISTRO DEL SERVICE WORKER (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado', reg))
          .catch(err => console.log('Error SW', err));
      });
    }

    // 3. CAPTURA DEL EVENTO DE INSTALACIÓN
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      appFrame.contentWindow.postMessage({ type: 'PWA_AVAILABLE' }, '*');
    });

    // 4. LÓGICA DE 40 MENSAJES ROTATIVOS (Cada 2 segundos = 80 seg de cobertura)
    const splashMessages = [
      { title: "Iniciando PrestaJara...", sub: "Estableciendo conexión segura" },
      { title: "Autenticando sesión...", sub: "Verificando credenciales de acceso" },
      { title: "Sincronizando base...", sub: "Descargando información general" },
      { title: "Construyendo entorno...", sub: "Cargando permisos y accesos" },
      { title: "Preparando interfaz...", sub: "Aplicando tu diseño personalizado" },
      { title: "Optimizando sistema...", sub: "Acelerando el motor de renderizado" },
      { title: "Validando seguridad...", sub: "Comprobando encriptación de datos" },
      { title: "Cargando catálogos...", sub: "Obteniendo lista de artículos" },
      { title: "Actualizando clientes...", sub: "Sincronizando expedientes y saldos" },
      { title: "Revisando caja...", sub: "Validando el estado financiero" },
      { title: "Preparando reportes...", sub: "Compilando historial de transacciones" },
      { title: "Configurando alertas...", sub: "Revisando notificaciones pendientes" },
      { title: "Alineando widgets...", sub: "Cargando herramientas del dashboard" },
      { title: "Activando biometría...", sub: "Inicializando captura fotográfica" },
      { title: "Revisando contratos...", sub: "Validando firmas y documentos" },
      { title: "Estamos demorando...", sub: "Hay mucha información por procesar" },
      { title: "No cierres la página...", sub: "El servidor sigue trabajando" },
      { title: "Generando caché...", sub: "Para que tu navegación sea más rápida" },
      { title: "Estructurando menús...", sub: "Acomodando barras de navegación" },
      { title: "Validando permisos...", sub: "Revisando qué módulos puedes ver" },
      { title: "Verificando red...", sub: "Asegurando una conexión estable" },
      { title: "Procesando tablas...", sub: "Ordenando registros de la base de datos" },
      { title: "Limpiando variables...", sub: "Preparando un entorno limpio" },
      { title: "Ajustando visibilidad...", sub: "Cargando preferencias de usuario" },
      { title: "Recuperando avatares...", sub: "Buscando fotos de perfil" },
      { title: "Cargando tipografías...", sub: "Aplicando estilos visuales" },
      { title: "Iniciando módulos...", sub: "Despertando funciones internas" },
      { title: "Calculando saldos...", sub: "Actualizando números en tiempo real" },
      { title: "Revisando inventario...", sub: "Validando existencias actuales" },
      { title: "¡Paciencia por favor!...", sub: "Casi terminamos de ensamblar todo" },
      { title: "Comprobando sesión...", sub: "Verificando dispositivo actual" },
      { title: "Alistando gráficas...", sub: "Preparando el análisis visual" },
      { title: "Cargando historial...", sub: "Obteniendo datos de ventas anteriores" },
      { title: "Revisando bitácora...", sub: "Sincronizando auditoría de eventos" },
      { title: "Configurando teclado...", sub: "Activando accesos rápidos" },
      { title: "Estableciendo PWA...", sub: "Validando instalación de aplicación" },
      { title: "Últimos ajustes...", sub: "Afinando detalles de la pantalla" },
      { title: "Esto tarda un poco...", sub: "Pero garantiza que no haya errores" },
      { title: "Finalizando carga...", sub: "Iniciando despliegue de interfaz" },
      { title: "¡Casi listos!...", sub: "A punto de mostrar tu panel" }
    ];
    let msgIndex = 0;
    let msgInterval;

    function startSplashMessages() {
      const titleEl = document.getElementById('splashTitle');
      const subEl = document.getElementById('splashSubtitle');
      msgIndex = 0;
      if (titleEl) titleEl.innerText = splashMessages[msgIndex].title;
      if (subEl) subEl.innerText = splashMessages[msgIndex].sub;
      
      clearInterval(msgInterval);
      msgInterval = setInterval(() => {
        msgIndex = (msgIndex + 1) % splashMessages.length;
        if (titleEl && subEl) {
          titleEl.innerText = splashMessages[msgIndex].title;
          subEl.innerText = splashMessages[msgIndex].sub;
        }
      }, 2000); // Cambia cada 2 segundos
    }

    function stopSplashMessages() {
      clearInterval(msgInterval);
    }

    // 5. LÓGICA DE TIMERS DE RESCATE
    let rescueTimer;
    let hideTimer;

    function startTimers() {
      clearTimeout(rescueTimer);
      clearTimeout(hideTimer);
      const rescueBtn = document.getElementById('splashRescueBtn');
      if(rescueBtn) rescueBtn.classList.remove('show');
      
      // Aparece botón de rescate a los 18 segundos
      rescueTimer = setTimeout(() => {
          if (rescueBtn) rescueBtn.classList.add('show');
      }, 18000);
      
      // Oculta forzosamente a los 50 segundos (margen muy amplio para cuentas grandes)
      hideTimer = setTimeout(() => {
          document.getElementById('splash-screen').classList.add('hidden');
          stopSplashMessages();
      }, 50000);
    }

    // Iniciar rutinas
    startSplashMessages();
    startTimers();

    // 6. ESCUCHAR MENSAJES DESDE APPS SCRIPT
    window.addEventListener('message', function(event) {
      
      // A) Ocultar el Splash Screen
      if (event.data === 'HIDE_SPLASH_SCREEN') {
        document.getElementById('splash-screen').classList.add('hidden');
        clearTimeout(rescueTimer);
        clearTimeout(hideTimer);
        stopSplashMessages();
        const rescueBtn = document.getElementById('splashRescueBtn');
        if(rescueBtn) rescueBtn.classList.remove('show');
      }
      
      // B) Mostrar Splash Screen
      if (event.data === 'SHOW_SPLASH_SCREEN') {
        document.getElementById('splash-screen').classList.remove('hidden');
        startSplashMessages();
        startTimers();
      }

      // C) Aplicar Modo Oscuro desde la base de datos (Si es la primera vez que entra)
      if (event.data && event.data.type === 'SYNC_THEME') {
          if (event.data.tema === 'dark') {
              document.body.classList.add('dark-mode');
              document.getElementById('metaThemeColor').setAttribute("content", "#121212");
              localStorage.setItem('userTema', 'dark');
          } else {
              document.body.classList.remove('dark-mode');
              document.getElementById('metaThemeColor').setAttribute("content", "#1e3a8a");
              localStorage.setItem('userTema', 'light');
          }
      }

      // D) Disparar prompt de instalación PWA
      if (event.data === 'TRIGGER_INSTALL' && deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
             appFrame.contentWindow.postMessage({ type: 'PWA_INSTALLED' }, '*');
          }
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
